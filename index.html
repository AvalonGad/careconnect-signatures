<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CareConnect Signature Portal</title><style>body{margin:0;background:#f5f8fb;font-family:Segoe UI,Arial,sans-serif;color:#173f72}main{max-width:900px;margin:50px auto;padding:30px;background:white;border:1px solid #e1e7ee;border-radius:22px;box-shadow:0 18px 50px rgba(18,63,115,.08)}img{width:210px}h1{font-size:30px;margin:25px 0 8px}.sub{color:#74849a}.card{display:flex;justify-content:space-between;align-items:center;border:1px solid #e1e7ee;border-radius:14px;padding:17px 20px;margin-top:14px}.name{font-weight:700}.title{font-size:13px;color:#74849a;margin-top:4px}a{background:#173f72;color:white;text-decoration:none;padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700}.note{margin-top:25px;padding:15px;background:#f6f8fb;border-radius:10px;color:#657991;font-size:13px;line-height:1.5}</style><script src="employees.js"></script></head><body><main><img src="assets/careconnect-logo.png" alt="CareConnect"><h1>Corporate Email Signature Portal</h1><div class="sub">Select your name to open your personalised CareConnect signature.</div><div id="list"></div><div class="note"><b>Administrator:</b> edit employees.js to add/update people. Each employee receives a link like <code>signature.html?person=brian-piper</code>.</div></main><script>const list=document.getElementById('list');Object.entries(CARECONNECT.employees).forEach(([slug,p])=>{list.innerHTML+=`<div class="card"><div><div class="name">${p.name}</div><div class="title">${p.title}</div></div><a href="signature.html?person=${encodeURIComponent(slug)}">Open signature</a></div>`})</script></body></html>
